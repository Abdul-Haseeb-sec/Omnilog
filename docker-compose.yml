version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnilog-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # Mount persistent storage for Threat Intel and Analysis Reports
      - ./threat_intel.json:/app/threat_intel.json
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Build-time variables injected into the static React bundle
        # VITE_API_URL defaults to localhost:5000 for local testing
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_API_KEY: ${API_KEY:-}
    container_name: omnilog-dashboard
    ports:
      # Map host port 5173 to container Nginx port 80
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
