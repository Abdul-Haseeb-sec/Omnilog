title: Slow SSH Brute Force (Correlation)
id: 8b072236-4074-4735-b286-9dc4bfa4f40d
status: experimental
description: Detects a slow SSH brute force attack by aggregating failed authentication attempts from a single source IP over an extended timeframe (1 hour). This is designed to bypass traditional short-window threshold detections.
author: Detection Engineering Team
date: 2026-08-10
correlation:
    type: event_count
    rules:
        - d17df3d4-b778-4395-9bf6-b5fa53f20ba5
    group-by:
        - id.orig_h
    timespan: 1h
    condition:
        gte: 15
level: medium
falsepositives:
    - Legitimate users failing authentication multiple times over an hour (rare to exceed 15 times though).
    - Misconfigured internal scripts or cron jobs attempting to authenticate with expired credentials.
