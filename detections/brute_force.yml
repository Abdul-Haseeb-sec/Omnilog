title: SSH Failed Authentication (Base Rule)
id: d17df3d4-b778-4395-9bf6-b5fa53f20ba5
status: experimental
description: Detects a single failed SSH authentication attempt (base rule for correlation).
author: Detection Engineering Team
date: 2026-08-10
tags:
    - attack.credential_access
    - attack.t1110.001
logsource:
    product: zeek
    service: ssh
detection:
    selection:
        auth_success: false
    condition: selection
level: informational
