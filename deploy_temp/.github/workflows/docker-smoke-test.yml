name: Docker Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-create threat_intel.json to prevent Docker bind-mount as directory
        run: touch threat_intel.json

      - name: Create baseline .env for no-auth run
        run: |
          touch .env
          echo "API_PORT=5000" >> .env
          echo "CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173" >> .env

      - name: Build and Start Containers (No Auth)
        run: |
          docker compose build
          docker compose up -d
          # Wait for services to fully initialize
          sleep 10

      - name: Verify Backend (No Auth)
        run: |
          # Should return 200 OK since no API_KEY is set
          curl -f -i http://localhost:5000/reports || exit 1

      - name: Verify Frontend
        run: |
          # Should serve HTML on port 5173
          curl -f -i http://localhost:5173 || exit 1

      - name: Tear Down Containers
        run: docker compose down

      - name: Setup Environment with Auth
        run: |
          echo "API_KEY=test-auth-123" > .env
          echo "VITE_API_URL=http://localhost:5000" >> .env

      - name: Build and Start Containers (With Auth)
        run: |
          docker compose build
          docker compose up -d
          sleep 10

      - name: Verify Backend Auth Enforcement
        run: |
          # Curl should receive a 401 Unauthorized status. 
          # We capture the HTTP status code and assert it is 401.
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/reports)
          echo "Received status code: $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Auth enforcement failed. Expected 401, got $STATUS_CODE"
            exit 1
          fi

      - name: Tear Down Containers
        if: always()
        run: docker compose down
