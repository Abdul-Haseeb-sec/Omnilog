title: SSH Failed Authentication (Base Rule)
id: d17df3d4-b778-4395-9bf6-b5fa53f20ba5
status: experimental
description: Detects a single failed SSH authentication attempt (base rule for correlation).
author: Detection Engineering Team
date: 2026-08-10
tags:
    - attack.credential_access
    - attack.t1110.001
logsource:
    product: zeek
    service: ssh
detection:
    selection:
        auth_success: false
    condition: selection
level: informational
---
title: SSH Brute Force (Correlation)
id: 8b072236-4074-4735-b286-9dc4bfa4f40d
status: experimental
description: |
  Detects SSH brute force attacks by aggregating failed authentication attempts
  from a single source IP. The engine uses cumulative counting (no time-window
  eviction) to prevent slow attacks from evading detection by straddling a
  window boundary. This is a deliberate design choice for analyzing bounded,
  already-collected log files.
author: Detection Engineering Team
date: 2026-08-12
correlation:
    type: event_count
    rules:
        - d17df3d4-b778-4395-9bf6-b5fa53f20ba5
    group-by:
        - id.orig_h
    # Engine uses cumulative counting (no time-window eviction).
    # timespan is documented here for reference but is not enforced at runtime.
    timespan: cumulative
    condition:
        gte: 5
level: medium
falsepositives:
    - Legitimate users failing authentication multiple times (rare to exceed 5 times).
    - Misconfigured internal scripts or cron jobs attempting to authenticate with expired credentials.
