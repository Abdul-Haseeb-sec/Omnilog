services:
  - type: web
    name: omnilog-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: CORS_ORIGINS
        sync: false
